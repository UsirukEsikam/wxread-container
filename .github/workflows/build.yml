name: Build image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - runner.py
      - .dockerignore
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: wxread-image-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout wxread upstream
        uses: actions/checkout@v6
        with:
          repository: findmover/wxread
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          upstream_sha="$(git -C upstream rev-parse HEAD)"
          upstream_short="$(git -C upstream rev-parse --short=12 HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_short=${upstream_short}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          pull: true
          build-args: |
            UPSTREAM_SHA=${{ steps.meta.outputs.upstream_sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:upstream-${{ steps.meta.outputs.upstream_short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.github.wxread.upstream-revision=${{ steps.meta.outputs.upstream_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
